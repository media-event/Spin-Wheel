<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Undian Roulette</title>
  <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Poppins', 'Segoe UI', sans-serif; }
    
    body {
      background: linear-gradient(-45deg, #0f0c29, #302b63, #24243e, #141e30);
      background-size: 400% 400%;
      animation: gradientBG 15s ease infinite;
      min-height: 100vh;
      color: #fff;
      padding: 20px;
      display: flex;
      flex-direction: column;
      align-items: center;
      overflow-x: hidden;
    }

    @keyframes gradientBG {
      0% { background-position: 0% 50%; }
      50% { background-position: 100% 50%; }
      100% { background-position: 0% 50%; }
    }

    h1 {
      margin-bottom: 25px;
      font-size: 2.3rem;
      font-weight: 800;
      text-align: center;
      background: linear-gradient(to right, #fff, #ffe66d, #00d2d3);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      text-shadow: 0 5px 15px rgba(0,0,0,0.3);
    }
    
    .dashboard-container {
      display: flex;
      flex-direction: row;
      flex-wrap: wrap;
      justify-content: center;
      align-items: flex-start;
      gap: 25px;
      width: 100%;
      max-width: 1200px;
    }

    .panel {
      background: rgba(255, 255, 255, 0.07);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      border: 1px solid rgba(255, 255, 255, 0.18);
      border-radius: 20px;
      padding: 22px;
      box-shadow: 0 15px 35px rgba(0, 0, 0, 0.4);
    }

    .input-panel { flex: 1; min-width: 270px; max-width: 320px; }
    .input-panel h3 { 
      margin-bottom: 12px; 
      font-size: 1.15rem; 
      border-bottom: 2px solid rgba(255,255,255,0.2); 
      padding-bottom: 8px;
      color: #ffe66d;
    }
    textarea {
      width: 100%;
      height: 220px;
      padding: 12px;
      border-radius: 12px;
      border: 1px solid rgba(255, 255, 255, 0.2);
      outline: none;
      font-size: 0.95rem;
      resize: vertical;
      background: rgba(15, 23, 42, 0.7);
      color: #fff;
      line-height: 1.6;
      box-shadow: inset 0 2px 4px rgba(0,0,0,0.5);
    }
    textarea:focus { border-color: #00d2d3; }

    .btn-apply {
      width: 100%;
      margin-top: 10px;
      background: linear-gradient(45deg, #00d2d3, #54a0ff);
      color: white;
      border: none;
      padding: 10px;
      font-size: 0.95rem;
      font-weight: 700;
      border-radius: 8px;
      cursor: pointer;
      transition: all 0.2s ease;
    }
    .btn-apply:hover { opacity: 0.9; transform: translateY(-2px); }

    .wheel-panel {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
    }
    .wheel-container { 
      position: relative; 
      width: 380px; 
      height: 380px; 
      margin-bottom: 25px; 
      border-radius: 50%;
      padding: 8px;
      background: linear-gradient(145deg, #ff007f, #00d2d3, #ffe66d);
      box-shadow: 0 0 30px rgba(0, 210, 211, 0.4), 0 0 60px rgba(255, 0, 127, 0.2);
      cursor: pointer;
      transition: transform 0.1s ease;
    }
    .wheel-container:active {
      transform: scale(0.97);
    }

    .pointer {
      position: absolute;
      top: -16px;
      left: 50%;
      transform: translateX(-50%);
      width: 0;
      height: 0;
      border-left: 18px solid transparent;
      border-right: 18px solid transparent;
      border-top: 32px solid #ff4757;
      z-index: 10;
      filter: drop-shadow(0px 6px 8px rgba(0,0,0,0.6));
      transition: transform 0.05s ease;
      pointer-events: none;
    }
    .pointer.tick { transform: translateX(-50%) rotate(-12deg); }

    canvas { 
      width: 100%; 
      height: 100%; 
      border-radius: 50%; 
      box-shadow: inset 0 0 15px rgba(0,0,0,0.6);
      background: #111;
    }
    
    .btn-spin {
      background: linear-gradient(45deg, #11998e, #38ef7d);
      color: white;
      border: none;
      padding: 16px 50px;
      font-size: 1.25rem;
      font-weight: 800;
      border-radius: 50px;
      cursor: pointer;
      box-shadow: 0 6px 20px rgba(56, 239, 125, 0.4);
      transition: all 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
      animation: pulse 2s infinite;
    }
    .btn-spin:hover { transform: scale(1.08); box-shadow: 0 10px 30px rgba(56, 239, 125, 0.6); }
    .btn-spin:disabled { background: #57606f; cursor: not-allowed; transform: scale(1); animation: none; box-shadow: none; }

    @keyframes pulse {
      0% { box-shadow: 0 0 0 0 rgba(56, 239, 125, 0.7); }
      70% { box-shadow: 0 0 0 18px rgba(56, 239, 125, 0); }
      100% { box-shadow: 0 0 0 0 rgba(56, 239, 125, 0); }
    }

    .result-panel { flex: 1; min-width: 270px; max-width: 320px; }
    .result-panel h3 { 
      margin-bottom: 15px; 
      font-size: 1.15rem; 
      border-bottom: 2px solid rgba(255,255,255,0.2); 
      padding-bottom: 8px;
      color: #ffe66d;
    }
    .winner-list { list-style: none; }
    .winner-item {
      background: linear-gradient(135deg, rgba(255,255,255,0.15), rgba(255,255,255,0.05));
      border: 1px solid rgba(255,255,255,0.2);
      margin-bottom: 12px;
      padding: 12px 16px;
      border-radius: 12px;
      font-weight: 600;
      font-size: 1.05rem;
      display: flex;
      align-items: center;
      justify-content: space-between;
      animation: fadeIn 0.5s ease;
      box-shadow: 0 4px 10px rgba(0,0,0,0.2);
    }
    .winner-badge {
      background: linear-gradient(45deg, #ffe66d, #ff7f50);
      color: #111;
      padding: 4px 10px;
      border-radius: 20px;
      font-size: 0.75rem;
      font-weight: 800;
      text-transform: uppercase;
    }

    .modal { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.8); backdrop-filter: blur(8px); justify-content: center; align-items: center; z-index: 100; }
    .modal-content { 
      background: linear-gradient(135deg, #1e1b4b, #312e81);
      border: 2px solid #ffe66d;
      color: #fff; 
      padding: 35px; 
      border-radius: 20px; 
      text-align: center; 
      max-width: 350px; 
      width: 90%; 
      box-shadow: 0 20px 50px rgba(0,0,0,0.6);
      animation: popIn 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275); 
    }
    .modal-content h2 { margin-bottom: 10px; color: #ffe66d; font-size: 1.6rem; }
    .modal-content p { font-size: 1.8rem; font-weight: 800; margin: 15px 0; color: #00d2d3; text-shadow: 0 2px 10px rgba(0,210,211,0.5); }
    .btn-close { 
      background: linear-gradient(45deg, #ff007f, #7928ca);
      color: white; 
      border: none; 
      padding: 12px 30px; 
      border-radius: 30px; 
      font-weight: 700; 
      cursor: pointer;
      box-shadow: 0 4px 15px rgba(255,0,127,0.4);
      transition: all 0.2s ease;
    }
    .btn-close:hover { transform: scale(1.05); }
    
    @keyframes popIn { 0% { transform: scale(0.6); opacity: 0; } 100% { transform: scale(1); opacity: 1; } }
    @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }

    @media (max-width: 900px) {
      .dashboard-container { flex-direction: column; align-items: center; }
      .input-panel, .result-panel { max-width: 100%; width: 100%; }
    }
  </style>
</head>
<body>

  <h1>Undian Roulette 🎯</h1>

  <div class="dashboard-container">
    <div class="panel input-panel">
      <h3>Daftar Peserta Spin</h3>
      <textarea id="namesInput" oninput="updateCandidatesFromInput()" placeholder="Masukkan 1 nama per baris..."></textarea>
      <button class="btn-apply" onclick="updateCandidatesFromInput()">Update Roda</button>
    </div>

    <div class="wheel-panel">
      <div class="wheel-container" onclick="shuffleAndRefreshWheel()" title="Klik untuk mengacak / merefresh tampilan roda">
        <div id="pointer" class="pointer"></div>
        <canvas id="wheelCanvas" width="500" height="500"></canvas>
      </div>
      <button id="spinBtn" class="btn-spin" onclick="spinWheel()">PUTAR RODA</button>
    </div>

    <div class="panel result-panel">
      <h3>Daftar Pemenang</h3>
      <ul id="winnerList" class="winner-list"></ul>
    </div>
  </div>

  <div id="winnerModal" class="modal">
    <div class="modal-content">
      <h2>🎉 SELAMAT! 🎉</h2>
      <p id="winnerName">-</p>
      <button class="btn-close" onclick="closeModal()">Lanjutkan</button>
    </div>
  </div>

  <script>
    let candidates = [];
    
    // URUTAN BARU 3 PEMENANG TERKUNCI (Elias -> Indra -> Faris)
    const targetKeywords = [
      ["elias", "eliaz"],  // Spin 1
      ["indra"],           // Spin 2
      ["faris", "fariz"]   // Spin 3
    ];

    let currentSpinStep = 0;
    
    const colors = [
      "#ff2d55", "#5856d6", "#007aff", "#34c759", 
      "#ff9500", "#af52de", "#5ac8fa", "#ffcc00", "#ff3b30"
    ];

    const canvas = document.getElementById("wheelCanvas");
    const ctx = canvas.getContext("2d");
    const pointerEl = document.getElementById("pointer");

    let currentRotation = 0;
    let isSpinning = false;
    let lastSliceIndex = -1;

    let audioCtx = null;
    function initAudio() {
      if (!audioCtx) {
        audioCtx = new (window.AudioContext || window.webkitAudioContext)();
      }
    }

    function playTickSound() {
      if (!audioCtx) return;
      const osc = audioCtx.createOscillator();
      const gain = audioCtx.createGain();
      osc.type = "sine";
      osc.frequency.setValueAtTime(650, audioCtx.currentTime);
      osc.frequency.exponentialRampToValueAtTime(120, audioCtx.currentTime + 0.04);
      gain.gain.setValueAtTime(0.3, audioCtx.currentTime);
      gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.04);
      osc.connect(gain);
      gain.connect(audioCtx.destination);
      osc.start();
      osc.stop(audioCtx.currentTime + 0.04);

      pointerEl.classList.add("tick");
      setTimeout(() => pointerEl.classList.remove("tick"), 50);
    }

    function playVictorySound() {
      if (!audioCtx) return;
      const notes = [
        { freq: 523.25, time: 0, duration: 0.15 },
        { freq: 659.25, time: 0.15, duration: 0.15 },
        { freq: 783.99, time: 0.3, duration: 0.15 },
        { freq: 1046.50, time: 0.45, duration: 0.5 }
      ];
      notes.forEach(note => {
        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();
        osc.type = "triangle";
        osc.frequency.setValueAtTime(note.freq, audioCtx.currentTime + note.time);
        gain.gain.setValueAtTime(0.4, audioCtx.currentTime + note.time);
        gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + note.time + note.duration);
        osc.connect(gain);
        gain.connect(audioCtx.destination);
        osc.start(audioCtx.currentTime + note.time);
        osc.stop(audioCtx.currentTime + note.time + note.duration);
      });
    }

    function updateCandidatesFromInput() {
      if (isSpinning) return;
      const text = document.getElementById("namesInput").value;
      const lines = text.split("\n").map(l => l.trim()).filter(l => l !== "");
      candidates = lines;
      drawWheel();
    }

    function shuffleAndRefreshWheel() {
      if (isSpinning) return;
      updateCandidatesFromInput();
      if (candidates.length > 1) {
        for (let i = candidates.length - 1; i > 0; i--) {
          const j = Math.floor(Math.random() * (i + 1));
          [candidates[i], candidates[j]] = [candidates[j], candidates[i]];
        }
        document.getElementById("namesInput").value = candidates.join("\n");
        drawWheel();
      }
    }

    function drawWheel() {
      const radius = canvas.width / 2;
      const numSlices = candidates.length;

      ctx.clearRect(0, 0, canvas.width, canvas.height);

      if (numSlices === 0) {
        ctx.save();
        ctx.translate(radius, radius);
        ctx.textAlign = "center";
        ctx.fillStyle = "rgba(255,255,255,0.4)";
        ctx.font = "bold 20px 'Poppins', Arial";
        ctx.fillText("Masukkan nama peserta...", 0, 5);
        ctx.restore();
        return;
      }

      const sliceAngle = (2 * Math.PI) / numSlices;

      for (let i = 0; i < numSlices; i++) {
        const startAngle = i * sliceAngle + currentRotation;
        const endAngle = startAngle + sliceAngle;

        ctx.beginPath();
        ctx.moveTo(radius, radius);
        ctx.arc(radius, radius, radius, startAngle, endAngle);
        ctx.fillStyle = colors[i % colors.length];
        ctx.fill();
        
        ctx.strokeStyle = "rgba(255,255,255,0.4)";
        ctx.lineWidth = 3;
        ctx.stroke();

        ctx.save();
        ctx.translate(radius, radius);
        ctx.rotate(startAngle + sliceAngle / 2);
        ctx.textAlign = "right";
        ctx.fillStyle = "#fff";
        ctx.font = "bold 21px 'Poppins', Arial";
        ctx.shadowColor = "rgba(0,0,0,0.7)";
        ctx.shadowBlur = 5;
        ctx.fillText(candidates[i], radius - 28, 7);
        ctx.restore();
      }

      ctx.beginPath();
      ctx.arc(radius, radius, 25, 0, 2 * Math.PI);
      ctx.fillStyle = "#ffffff";
      ctx.fill();
      ctx.shadowColor = "rgba(0,0,0,0.5)";
      ctx.shadowBlur = 10;

      // Suara Tick Jarum (Jam 12)
      const pointerAngle = 1.5 * Math.PI;
      let angleUnderPointer = (pointerAngle - (currentRotation % (2 * Math.PI)) + 2 * Math.PI) % (2 * Math.PI);
      const currentSliceIndex = Math.floor(angleUnderPointer / sliceAngle) % numSlices;

      if (currentSliceIndex !== lastSliceIndex && isSpinning) {
        playTickSound();
        lastSliceIndex = currentSliceIndex;
      }
    }

    drawWheel();

    function getWinningTargetIndex() {
      if (currentSpinStep < targetKeywords.length) {
        const keywords = targetKeywords[currentSpinStep];
        for (let i = 0; i < candidates.length; i++) {
          const nameLower = candidates[i].toLowerCase();
          if (keywords.some(kw => nameLower.includes(kw.toLowerCase()))) {
            return i;
          }
        }
      }
      return 0;
    }

    function spinWheel() {
      if (isSpinning) return;
      if (candidates.length === 0) {
        alert("Silakan masukkan daftar nama peserta terlebih dahulu!");
        return;
      }

      initAudio();
      isSpinning = true;
      document.getElementById("spinBtn").disabled = true;

      const targetIndex = getWinningTargetIndex();
      const numSlices = candidates.length;
      const sliceAngle = (2 * Math.PI) / numSlices;
      
      const pointerAngle = 1.5 * Math.PI; // Jam 12
      
      // RUMUS ROTASI PRESISI SEARAH JARUM JAM
      let desiredAngle = pointerAngle + (numSlices - targetIndex - 0.5) * sliceAngle;
      
      // PUTARAN DRAMATIS (10-12 Putaran)
      const extraRotations = (10 + Math.floor(Math.random() * 3)) * 2 * Math.PI;
      
      let delta = (desiredAngle - currentRotation) % (2 * Math.PI);
      if (delta < 0) delta += 2 * Math.PI;

      const startRotation = currentRotation;
      const finalRotation = currentRotation + delta + extraRotations;

      const startTime = performance.now();
      const spinDuration = 11000; // 11 Detik (Halus & Dramatis)

      function animateSpin(now) {
        const elapsed = now - startTime;
        const progress = Math.min(elapsed / spinDuration, 1);
        
        // Easing Quintic-Out
        const easeOut = 1 - Math.pow(1 - progress, 5);
        
        currentRotation = startRotation + (finalRotation - startRotation) * easeOut;
        
        drawWheel();

        if (progress < 1) {
          requestAnimationFrame(animateSpin);
        } else {
          currentRotation = finalRotation;
          drawWheel();
          
          let angleUnderPointer = (pointerAngle - (currentRotation % (2 * Math.PI)) + 2 * Math.PI) % (2 * Math.PI);
          let winnerIndex = Math.floor(angleUnderPointer / sliceAngle) % numSlices;
          let winnerName = candidates[winnerIndex];

          showWinner(winnerName, winnerIndex);
          isSpinning = false;
        }
      }

      requestAnimationFrame(animateSpin);
    }

    function showWinner(name, indexToRemove) {
      document.getElementById("winnerName").innerText = name;
      document.getElementById("winnerModal").style.display = "flex";
      playVictorySound();
      confetti({ particleCount: 150, spread: 90, origin: { y: 0.6 } });

      currentSpinStep++;
      const listEl = document.getElementById("winnerList");
      const li = document.createElement("li");
      li.className = "winner-item";
      li.innerHTML = `<span>${currentSpinStep}. ${name}</span> <span class="winner-badge">Terpilih</span>`;
      listEl.appendChild(li);

      // Eliminasi pemenang dari daftar peserta
      candidates.splice(indexToRemove, 1);
      document.getElementById("namesInput").value = candidates.join("\n");
    }

    function closeModal() {
      document.getElementById("winnerModal").style.display = "none";
      drawWheel();
      if (candidates.length > 0) {
        document.getElementById("spinBtn").disabled = false;
      }
    }
  </script>
</body>
</html>
